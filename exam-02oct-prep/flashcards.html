<style>
  :root {
    --bg: #0f1419;

  * { box-sizing: border-box; }
  html, body {

    min-height: 100vh;

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    gap: 20px;
  }
  h1 {

    color: var(--accent);
    margin: 0;
    text-align: center;
    letter-spacing: 0.3px;

  }
  .card-scene {
    width: 100%;
    max-width: 640px;
    height: 380px;
    perspective: 1600px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 30px;
    border-radius: 20px;
    backface-visibility: hidden;
    background: linear-gradient(150deg, var(--card-bg), var(--card-bg-2));
    border: 1px solid var(--border);

    overflow-y: auto;
  }
  .card-face::-webkit-scrollbar { width: 6px; }
  .card-face::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .card-face.front {
    z-index: 2;
  }
  .card-face.back {
    transform: rotateY(180deg);
    border-color: rgba(74,163,255,0.35);
  }
  .face-label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  .face-label.back-label { color: var(--accent); }
  .card-text {
    font-size: 1.35rem;
    line-height: 1.6;
    text-align: center;
    font-weight: 500;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 12px;
  }
  .card-face.back .card-text {
    font-size: 1.15rem;
    font-weight: 400;
    color: #d7e6fb;
  }
  .card-text b { color: var(--accent); font-weight: 700; }
  .hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.78rem;
    color: var(--text-dim);
    opacity: 0.7;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  button {
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: #262f3d;
    border-color: var(--accent);
  }
  button:active {
    transform: scale(0.96);
  }
  button.primary {
    background: var(--accent);
    color: #06131f;
    font-weight: 600;
    border-color: var(--accent);
  }
  button.primary:hover {
    background: #6fc3ff;
  }
  .shuffle-active {
    color: var(--accent);
    border-color: var(--accent);
  }
  .footer-note {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-align: center;
    max-width: 640px;
    opacity: 0.75;
  }
  @media (max-width: 480px) {
    .card-scene { height: 420px; }
    .card-text { font-size: 1.1rem; }
    button { padding: 10px 14px; font-size: 0.85rem; }
  }
</style>

เครื่องมือใด", "b": "Salivary duct probe size 0000 ถึง size 8 ร่วมกับ Salivary duct Dilator", "t": "Sialendoscopy"}, {"f": "วัสดุเย็บแผลกรณีผ่าเปิดคืออะไร", "b": "Vicryl 4/0 17 mm", "t": "Sialendoscopy"}, {"f": "หลังผ่าตัด Sialendoscopy ต้องประคบเย็นนานเท่าไร", "b": "24 ชั่วโมงแรก", "t": "Sialendoscopy"}, {"f": "คำแนะนำกระตุ้นน้ำลายหลังผ่าตัดคืออะไร ช่วงเวลาใด", "b": "ดื่มน้ำมะนาว/น้ำผลไม้รสเปรี้ยว 2-3 วันแรกหลังผ่าตัด", "t": "Sialendoscopy"}, {"f": "Stent ที่ใส่ค้ำยันท่อน้ำลายหลุดเองได้ในกี่สัปดาห์", "b": "1-2 สัปดาห์ ไม่ต้องตกใจ เก็บ Stent ที่หลุดไว้ให้แพทย์ดู", "t": "Sialendoscopy"}, {"f": "ESI (Emergency Severity Index) แบ่งเป็นกี่ระดับ ช่วยเพิ่มอัตรารอดชีวิตกี่เปอร์เซ็นต์", "b": "5 ระดับ (Resuscitation / Emergency / Urgent / Semi-Urgent / Non-Urgent) / เพิ่มอัตรารอดชีวิตได้ร้อยละ 15", "t": "ENTEmergency"}, {"f": "Primary Triage กับ Secondary Triage ต่างกันอย่างไร", "b": "Primary = รวบรวมข้อมูลจากประเมินทางกายภาพ ไม่ต้องตรวจละเอียด / Secondary = ประเมินผู้ป่วยอย่างละเอียด", "t": "ENTEmergency"}, {"f": "ปัญหาหลัก 3 ด้านของ Upper Airway Obstruction คืออะไร", "b": "Airway inadequate / Ventilation inadequate / Oxygenation inadequate", "t": "ENTEmergency"}, {"f": "Stridor คืออะไร", "b": "เสียงผิดปกติจาก turbulent airflow ผ่านทางเดินหายใจที่อุดกั้นบางส่วน ได้ยินตอนหายใจเข้าหรือออก", "t": "ENTEmergency"}, {"f": "ENT.SI targeted response time คือเท่าไร", "b": "ต้องได้แผนการรักษาภายใน 30 นาที และเจาะคอ (tracheostomy) ภายใน 40 นาที", "t": "ENTEmergency"}, {"f": "Code D delta คืออะไร ติดต่อทางไหน", "b": "Difficult Airway Code สายด่วน VPN 09-5289", "t": "ENTEmergency"}, {"f": "Code D delta แบ่ง D1 กับ D2 เป็นใคร", "b": "D1 = แพทย์ประจำบ้านวิสัญญีปี 2 (code A2) / D2 = แพทย์ประจำบ้าน ENT ปี 1 (emergency ที่ 1)", "t": "ENTEmergency"}, {"f": "MEWS-UAO algorithm ก่อนเข้า Difficult Airway Code ให้ยาอะไร ขนาดเท่าไร", "b": "Dexamethasone 100 mg แล้วตามด้วย 20 mg ทุก 6 ชั่วโมง ร่วมกับ Antibiotics", "t": "ENTEmergency"}, {"f": "Needle cricothyroidotomy ใช้เข็มเบอร์อะไร ต่อกับอุปกรณ์อ oning System) — ดาวเทียมรับสัญญาณ คอมพิวเตอร์ประเมินผลแสดงตำแหน่งบนแผนที่", "t": "NeuroNavigator"}, {"f": "เครื่อง Navigator ที่ใช้ในหน่วยผ่าตัดประสาทศัลยศาสตร์ศิริราชมีกี่ยี่ห้อ อะไรบ้าง", "b": "2 ยี่ห้อ: Brain lab และ Medtronic Stealth Station (รุ่น S7, S8)", "t": "NeuroNavigator"}, {"f": "Reference Frame ชนิด Active กับ Passive ต่างกันอย่างไร", "b": "Active = ติดก่อนการผ่าตัด กับขาจับ Mayfield / Passive = ใช้ในสนามผ่าตัดที่ปลอดเชื้อ ร่วมกับ Passive ball", "t": "NeuroNavigator"}, {"f": "Z-touch คืออะไร", "b": "การลงทะเบียนแบบ touchless ด้วยการรับรู้อัตโนมัติของการสะท้อนแสงเลเซอร์โดยกล้องอินฟราเรด (อยู่ใน Probe แบบ Active)", "t": "NeuroNavigator"}, {"f": "สัญลักษณ์สีบนจอ Stealth Station เขียว เหลือง แดง หมายถึงอะไร", "b": "เขียว = camera เห็นเครื่องมือชัดเจน / เหลือง = ไม่เห็นแต่ยังทำงานได้ / แดง = ไม่เห็นและทำงานไม่ได้", "t": "NeuroNavigator"}, {"f": "ข้อห้ามในการทำความสะอาดและทำให้ปลอดเชื้อ Passive marker คืออะไร", "b": "ห้ามถู Passive marker ตอนทำความสะอาดด้วยแปรง / ห้ามทำ Steam Sterilization (Autoclave)", "t": "NeuroNavigator"}, {"f": "เลนส์กล้อง Navigator ต้องเช็ดด้วยอะไร จอภาพห้ามใช้น้ำยาประเภทใด", "b": "เลนส์ใช้ผ้าเช็ดเลนส์เฉพาะเท่านั้น / จอภาพห้ามใช้น้ำยา solvent (ลบ/ขจัดคราบ)", "t": "NeuroNavigator"}, {"f": "วิธีทำให้ปลอดเชื้อ (sterilization) ของอุปกรณ์ Navigator มีกี่วิธี อะไรบ้าง", "b": "3 วิธี: ETO (Ethylene oxide) / Sterrad (Hydro peroxide) / Steam Sterilization (Autoclave)", "t": "NeuroNavigator"}, {"f": "CSF Management/Shunt placement ใช้ระบบใด มีข้อดีอย่างไรเรื่อง head fixation", "b": "Electromagnetic system (AxiEM) แบบ No head pin", "t": "NeuroNavigator"}, {"f": "Hybrid OR คืออะไร", "b": "ห้องผ่าตัดที่ผสานเทคโนโลยีสร้างภาพขั้นสูง (CT/MRI) เข้ากับห้องผ่าตัดปกติ วินิจฉัย-รักษาในห้องเดียวแบบ one visit", "t": "NeuroNavigator"}, {"f": "ทีมสหสาขาในห้อง Hybrid OR ประกอบด้วยใครบ้าง", "b": "ศัลยแพทย์ / วิสัญญีแพทย์ / รังสีแพทย์ / พยาบาลห้องผ่าตัด", "t": "NeuroNavigator"}, {"f": "Workflow ของ Navigation มี 6 ขั้นตอนอะไรบ้าง ตามลำดับ", "b": "Pre-operative imaging → Planning → Registration → Real-time navigation → Tumor removal → Closure", "t": "NeuroNavigator"}, {"f": "ใครเป็นผู้ทำ registration navigator ในห้องผ่าตัด", "b": "ศัลยแพทย์ (ไม่ใช่พยาบาล) พยาบาลมีบทบาทสนับสนุน/เตรียมอุปกรณ์", "t": "NeuroNavigator"}, {"f": "VP Shunt กับ Omaya Shunt ต่างกันอย่างไร", "b": "VP Shunt ระบายน้ำไขสันหลังลงช่องท้องถาวร รักษา hydrocephalus / Omaya Shunt เป็นอ่างใต้หนังศีรษะใช้ให้ยาเคมีบำบัด/เจาะตรวจซ้ำ", "t": "NeuroNavigator"}, {"f": "Endoscopic Third Ventriculostomy (ETV) ใช้รักษาภาวะใด ทำงานอย่างไร", "b": "รักษา hydrocephalus ชนิดอุดตัน โดยเปิดทางเดินใหม่ให้น้ำไขสันหลังระบายออกได้เองโดยไม่ฝังอุปกรณ์", "t": "NeuroNavigator"}, {"f": "Stereotactic biopsy (Frame Link) ต่างจาก VarioGuide biopsy (Frameless) อย่างไร", "b": "Frame Link ต้องติดกรอบยึดศีรษะ (stereotactic frame) / VarioGuide ไม่ต้องใช้ frame แต่ใช้ sure track ร่วมกับ needle biopsy", "t": "NeuroNavigator"}, {"f": "DBS (Deep Brain Stimulation) ฝังสายกระตุ้นที่ตำแหน่งใด ใช้อุปกรณ์อะไรร่วมกัน", "b": "Globus Pallidus หรือ Subthalamic nucleus / ใช้ stereotactic frame ร่วมกับ O-Arm รักษา Parkinson's disease", "t": "NeuroNavigator"}, {"f": "AVM angiogram ระหว่างผ่าตัดฉีด contrast media เข้าทางหลอดเลือดใด ร่วมกับเครื่องมืออะไร", "b": "femoral artery (ขาหนีบ) ร่วมกับ fluoroscope (C-arm)", "t": "NeuroNavigator"}, {"f": "ETV เชื่อมต่อโครงสร้างใดกับใด ผ่านอะไร", "b": "The 3rd ventricle เชื่อมกับ Interpeduncular cistern ผ่าน Tuber cinereum", "t": "EndoscopicNeuro"}, {"f": "ETV ต้องเปิดเข้าไปใน membrane ใด", "b": "Liliequist membrane", "t": "EndoscopicNeuro"}, {"f": "ETV ใช้อุปกรณ์ใดถ่างขยาย floor of third ventricle ขนาดเท่าไร", "b": "Fogarty catheter No. 4 ถ่างขยายให้ได้ 4-5 มิลลิเมตร", "t": "EndoscopicNeuro"}, {"f": "ETV skin incision อยู่ตำแหน่งใด", "b": "หน้าต่อ coronal suture เล็กน้อย ห่างแนวกลาง 1.5 ซม.", "t": "EndoscopicNeuro"}, {"f": "ETV ใช้มุมกล้อง rigid telescope กี่องศา", "b": "0°, 30°, 70°", "t": "EndoscopicNeuro"}, {"f": "ท่านอนหลังผ่าตัด ETV คือท่าใด", "b": "นอนหงายศีรษะสูง 30 องศา ศีรษะ-คอตรง", "t": "EndoscopicNeuro"}, {"f": "ระดับตั้งจุดหยด EVD มาตรฐานอยู่ที่ใด", "b": "10 เซนติเมตรเหนือระดับรูหู (เทียบเท่า Foramen of Monro)", "t": "EndoscopicNeuro"}, {"f": "ตั้งจุดหยด EVD สูงเกินไปกับต่ำเกินไปเกิดผลอย่างไร", "b": "สูงเกิน = CSF ไม่ระบายออก / ต่ำเกิน = CSF ระบายมากเกิน เสี่ยง brain herniation", "t": "EndoscopicNeuro"}, {"f": "ภาวะแทรกซ้อนหลังผ่าตัด ETV มีอะไรบ้าง", "b": "CSF leakage / ความดันในกะโหลกศีรษะสูง / Subdural hematoma / Bradycardia", "t": "EndoscopicNeuro"}, {"f": "Gas distension media ที่ใช้ใน MIS คืออะไร ต้องระวังอะไร", "b": "Carbon dioxide (CO2) ต้องระวัง gas emboli", "t": "EndoscopicNeuro"}, {"f": "Fluid distension media คืออะไร อุณหภูมิเท่าไร", "b": "0.9% NSS หรือ Lactated Ringer's warm ถึง 37°C", "t": "EndoscopicNeuro"}, {"f": "ห้าม warm irrigation fluid ด้วยวิธีใด เพราะอะไร", "b": "Microwave และ Autoclave เพราะควบคุมอุณหภูมิไม่ได้ (uncontrolled)", "t": "EndoscopicNeuro"}, {"f": "Endoscopic transnasal ต่างจาก Sublabial transseptal อย่างไร", "b": "Endoscopic = ไม่มีแผลนอก, septum คงเดิม, ไม่ pack จมูก / Sublabial = มีแผล, เอา septum ออกแล้วใส่กลับ, pack 3-5 วัน", "t": "EndoscopicNeuro"}, {"f": "Pituitary adenoma อยู่ตำแหน่งใด ขนาดเท่าไร", "b": "Posterior fossa ขนาด ~1 ซม. เส้นผ่านศูนย์กลาง", "t": "EndoscopicNeuro"}, {"f": "Superior orbital fissure ผ่านเส้นประสาทใด (จาก ophtha แต่เชื่อมกับ neuro anatomy)", "b": "CN III, IV, VI และ CN V1", "t": "EndoscopicNeuro"}, {"f": "Superior oblique และ Lateral rectus เลี้ยงด้วยเส้นประสาทใด", "b": "SO = CN IV / LR = CN VI", "t": "OphthalmicAnatomy"}, {"f": "กล้ามเนื้อตาที่เหลือ (MR, SR, IR, IO, Levator) เลี้ยงด้วยเส้นประสาทใด", "b": "CN III", "t": "OphthalmicAnatomy"}, {"f": "ระยะเกาะกล้ามเนื้อ rectus จาก limbus เรียงลำดับอย่างไร (Spiral of Tillaux)", "b": "SR 7.7 mm > LR 6.9 mm > IR 6.5 mm > MR 5.5 mm", "t": "OphthalmicAnatomy"}, {"f": "Vertical rectus และ Oblique muscles มี action รองอย่างไร", "b": "Vertical rectus = adductor เสมอ / Oblique muscles = abductor เสมอ", "t": "OphthalmicAnatomy"}, {"f": "ขนาดกระจกตา (แนวนอน/แนวตั้ง) และกำลังหักเหแสงเท่าไร", "b": "แนวนอน 12 mm, แนวตั้ง 11 mm, refractive power 43 diopters", "t": "OphthalmicAnatomy"}, {"f": "กระจกตามีกี่ชั้น อะไรบ้าง", "b": "5 ชั้น: Epithelium, Bowman's layer, Stroma, Descemet membrane, Endothelium", "t": "OphthalmicAnatomy"}, {"f": "Precorneal tear film หนาเท่าไร มีกี่ชั้น", "b": "หนา 3-4 microns มี 3 ชั้น: Lipid / Aqueous / Mucin", "t": "OphthalmicAnatomy"}, {"f": "Axial length ปกติของลูกตาเท่าไร Myopia vs Hyperopia ต่างกันอย่างไร", "b": "23-25 mm / Myopia = AL ยาวกว่า, Hyperopia = AL สั้นกว่า", "t": "OphthalmicAnatomy"}, {"f": "Sclera บางที่สุดตรงไหน หนาเท่าไร แตกบ่อยที่ไหน", "b": "บางสุด 0.3 mm หลังจุดเกาะกล้ามเนื้อ / แตกบ่อยสุดที่ superonasal quadrant ใกล้ limbus", "t": "OphthalmicAnatomy"}, {"f": "Anterior chamber ลึกและมีปริมาตรเท่าไร", "b": "ลึก ~3 mm ปริมาตร ~200 μL", "t": "OphthalmicAnatomy"}, {"f": "เส้นทางไหลเวียนของ Aqueous humor เป็นอย่างไร", "b": "Posterior chamber → pupil → Anterior chamber → Trabecular meshwork → Schlemm canal (± uveoscleral pathway)", "t": "OphthalmicAnatomy"}, {"f": "IOP ปกติเท่าไร", "b": "10-16 mmHg", "t": "OphthalmicAnatomy"}, {"f": "Vitreous มีปริมาตรเท่าไร ประกอบด้วยอะไร", "b": "~4.0 mL ประกอบด้วย 99% น้ำ + 1% hyaluronic acid/collagen", "t": "OphthalmicAnatomy"}, {"f": "Retina มีกี่ชั้น", "b": "10 ชั้น = RPE + neurosensory retina", "t": "OphthalmicAnatomy"}, {"f": "Optic nerve แบ่งเป็นกี่ส่วน อะไรบ้าง", "b": "4 ส่วน: intraocular, intraorbital, intracanalicular, intracranial", "t": "OphthalmicAnatomy"}, {"f": "พยาธิสภาพที่ optic chiasm ทำให้เกิด visual field defect แบบใด", "b": "Bitemporal hemianopia", "t": "OphthalmicAnatomy"}, {"f": "Presbyopia เกิดในอายุเท่าไร กลไกอย่างไร", "b": "อายุ ≥ 40 ปี จาก lens แข็งตัวตามอายุ ภาพตกหลัง retina", "t": "OphthalmicAnatomy"}, {"f": "Eye drop 1 หยดมีปริมาตรเท่าไร cul-de-sac รับได้เท่าไร", "b": "1 หยด = 0.05 mL (50 µL) / cul-de-sac รับได้ 30 μL", "t": "OphthalmicAnatomy"}, {"f": "Neck triangles แบ่งขอบเขตอย่างไร -op to PACU / PACU to Ward", "t": "handoff"}, {"f": "ประเด็นที่ต้องบันทึกใน Patient Transfer Record มี 6 ข้ออะไร", "b": "MDR (ดื้อยา) / Other / Special concern-Recommendation / Assistance needed for transfer / Change of patient condition during transfer / Signature", "t": "handoff"}, {"f": "N/A ในเอกสาร Patient Transfer Record มีความหมายว่าอะไร", "b": "not applicable (นำมาใช้ไม่ได้กับกรณีนั้น) หรือ not available (ไม่มีข้อมูล/หาไม่ได้)", "t": "handoff"}, {"f": "ขั้นตอน Safe surgery เรียงลำดับอย่างไร", "b": "Briefing / Sign in / Timeout / Sign out / Debriefing", "t": "handoff"}, {"f": "ยกเลิกใช้ paper SSSC ตั้งแต่เมื่อไร", "b": "ม.ค.63", "t": "handoff"}, {"f": "เครื่องมือ SWITCH for OR Hand Off มาจากที่ไหน ปีใด", "b": "Providence St Vincent Medical Center, Portland, OR, USA / ปี 2013", "t": "handoff"}, {"f": "WP การสื่อสารด้วย ISBAR ของ HR คณะฯ ดำเนินการต่อเนื่องปีใด", "b": "2566, 2567, 2568", "t": "handoff"}, {"f": "วัตถุประสงค์ของ Communication-ISBAR มี 3 ข้ออะไร", "b": "ลดระยะเวลา / กระชับรัดกุม / เน้นประเด็นสำคัญชัดเจนเพื่อการดูแลต่อเนื่อง", "t": "handoff"}, {"f": "ตัวอย่าง hand off ในห้องผ่าตัดมีใครถึงใครบ้าง", "b": "RN circulator ถึง RN circulator / scrub person ถึง scrub person / surgeon ถึง scrub nurse", "t": "handoff"}, {"f": "Hand-off มีชื่อเรียกอื่นอะไรบ้าง", "b": "handover / sign-over / shift report", "t": "handoff"}, {"f": "แนวคิด cognitive aids เช่น handoff checklist มีประโยชน์อย่างไร", "b": "ลดความแปรปรวนในการส่งต่อการดูแล และช่วยตรวจสอบว่าพูดคุยประเด็นสำคัญครบ เพราะทุกคนลืมบางอย่างได้เสมอ", "t": "handoff"}, {"f": "โมเดล ERAS มองความสัมพันธ์ของ 3 ส่วนใดที่ส่งผลต่อ Risk ผู้ป่วย", "b": "Surgery – Patient – Anesthesia", "t": "eras"}, {"f": "โปรแกรม ERAS ของ รพ.ศิริราชเรียกว่าอะไร", "b": "Si-ERAS protocols", "t": "eras"}, {"f": "กราฟ Functional capacity เทียบ Time ของ ERAS มี 3 เส้นทางอะไรบ้าง", "b": "Traditional care / Enhanced recovery / Prehabilitation", "t": "eras"}, {"f": "ERAS แบ่งเป็นกี่ช่วงเวลา อะไรบ้าง", "b": "4 ช่วง / Preadmission / Preoperative / Intraoperative / Postoperative", "t": "eras"}, {"f": "PAC ลด case-cancellation rate ได้เท่าไรเทียบกับไม่มี PAC", "b": "มี PAC = 0.9% (95% CI 0.7-1.2%) / ไม่มี PAC = 5.9% (95% CI 5.6-6.3%)", "t": "eras"}, {"f": "DM: HbA1c เท่าไรต้อง refer for optimization", "b": "HbA1c > 8-8.5%", "t": "eras"}, {"f": "DM: HbA1c เท่าไรควรพิจารณา postpone elective surgery", "b": "HbA1c > 10%", "t": "eras"}, {"f": "DM: ควร maintain FBS ในช่วงใด", "b": "108-216 mg/dL", "t": "eras"}, {"f": "HTN target BP ในผู้ป่วย ERAS คือเท่าไร", "b": "BP < 130/80 mmHg (ตาม guideline ปี 2025)", "t": "eras"}, {"f": "เป้าหมาย core temperature ระหว่างผ่าตัดของ ERAS คือเท่าไร", "b": "มากกว่า 36 องศาเซลเซียส", "t": "eras"}, {"f": "วิธีป้องกัน hypothermia ตาม ERAS มี 3 อย่างอะไรบ้าง", "b": "warm mattress / warmed IV-irrigation fluids / blankets and wraps for the head", "t": "eras"}, {"f": "ทำไม ERAS แนะนำ Combined GA + Regional analgesia", "b": "เพื่อ facilitate fast-track recovery", "t": "eras"}, {"f": "GA แบบ ERAS ควรหลีกเลี่ยงอะไร", "b": "หลีกเลี่ยง anesthesia ที่ลึกเกินไป และ residual effect ของ hypnotic opioid muscle relaxants", "t": "eras"}, {"f": "Preoperative element ของ ERAS มีอะไรบ้าง", "b": "Selective bowel preparation / Minimize NPO time / Preoperative carbohydrate drinks / Premedication / Review information and knowledge", "t": "eras"}, {"f": "Postoperative element ของ ERAS มีอะไรบ้าง", "b": "Early removal of drain-tubes / Stop IV fluids / Early oral intake / Multimodal opioid-sparing pain control / Early mobilization / Postdischarge follow-up", "t": "eras"}, {"f": "Frontal lobe เกี่ยวข้องกับหน้าที่ใดเป็นหลัก", "b": "Executive function: คิดวิเคราะห์ / decision making / การยับยั้งอารมณ์", "t": "neuro"}, {"f": "รอยโรค frontal lobe ด้านพฤติกรรมทำให้เกิดอาการอะไร", "b": "Disinhibition ขาดการยับยั้งชั่งใจ หุนหันพลันแล่น พูดหยาบคาย ละเลยสุขอนามัยส่วนตัว", "t": "neuro"}, {"f": "Motor homunculus: ส่วนใดของร่างกายมีพื้นที่แทนบนสมองใหญ่ที่สุด", "b": "มือ (รองลงมาคือกล้ามเนื้อใบหน้า)", "t": "neuro"}, {"f": "รอยโรค motor strip ทำให้อ่อนแรงด้านใดเทียบกับตำแหน่งรอยโรค", "b": "ด้านตรงข้าม (contralateral)", "t": "neuro"}, {"f": "Spasticity เกิดขึ้นเมื่อใดหลังรอยโรค motor strip", "b": "ระยะหลัง (ช่วงแรกเป็น flaccid ก่อน)", "t": "neuro"}, {"f": "Broca's aphasia มีลักษณะอย่างไร", "b": "พูดไม่ออกพูดติดขัดไม่เป็นประโยค (agrammatism) แต่เข้าใจภาษาที่ได้ยินดี", "t": "neuro"}, {"f": "Wernicke's aphasia มีลักษณะอย่างไร", "b": "พูดคล่อง (fluent) แต่รับรู้-แปลความหมายภาษาไม่ได้ ฟังไม่รู้เรื่อง", "t": "neuro"}, {"f": "Global aphasia เกิดจากรอยโรคใด", "b": "รอยโรคกว้างครอบคลุมทั้ง Broca's area และ Wernicke's area", "t": "neuro"}, {"f": "คนถนัดขวาส่วนใหญ่สมองซีกเด่นด้านภาษาอยู่ด้านใด", "b": "ด้านซ้าย เกือบร้อยเปอร์เซ็นต์", "t": "neuro"}, {"f": "รอยโรคสมองซีกไม่เด่น (non-dominant, parietal) มีอาการเด่นอะไร", "b": "Neglect syndrome (hemispatial neglect) / Agnosia / Anosognosia / Astereognosis", "t": "neuro"}, {"f": "Neglect syndrome ทดสอบด้วยวิธีใด", "b": "Clock Drawing Test: เลข 1-12 กระจุกด้านตรงข้ามกับรอยโรค", "t": "neuro"}, {"f": "Gerstmann syndrome (dominant hemisphere parietal) มีอาการอะไรบ้าง", "b": "Agraphia / Acalculia / Finger agnosia / Left-right disorientation (อาจมี Alexia, Apraxia ร่วม)", "t": "neuro"}, {"f": "Hippocampus (temporal lobe) มีหน้าที่เกี่ยวกับอะไร และชื่อมาจากอะไร", "b": "ความจำระยะสั้น/ความจำเรื่องใหม่ / ชื่อจากภาษากรีกแปลว่าม้าน้ำ", "t": "neuro"}, {"f": "Amygdala เกี่ยวข้องกับอะไร และถูกควบคุมโดยอะไร", "b": "อารมณ์และสัญชาตญาณดั้งเดิม (ความก้าวร้าว) ถูกควบคุมโดย frontal lobe", "t": "neuro"}, {"f": "รอยโรคที่ Meyer's loop ทำให้เกิดอาการอะไร", "b": "Quadrantanopia: เห็นภาพแหว่งประมาณ 1 ใน 4 ของลานสายตาฝั่งตรงข้าม", "t": "neuro"}, {"f": "Basal ganglia ทำหน้าที่อะไร และรอยโรคทำให้เกิดอาการอะไร", "b": "ยับยั้งระบบประสาทไม่ให้ทำงานมากเกินไป / รอยโรคที่ subthalamic nucleus ทำให้เคลื่อนไหวมากผิดปกติควบคุมไม่ได้ (ballism/chorea-like)", "t": "neuro"}, {"f": "Diencephalon ประกอบด้วยอะไร และแต่ละส่วนทำหน้าที่อะไร", "b": "Thalamus (รับความรู้สึก/เคลื่อนไหว) + Hypothalamus (ระบบประสาทอัตโนมัติ ควบคุมอุณหภูมิ ต่อมไร้ท่อ)", "t": "neuro"}, {"f": "รอยโรคที่ MLF (medial longitudinal fasciculus) ในก้านสมองทำให้เกิดภาวะใด", "b": "Internuclear ophthalmoplegia (INO)", "t": "neuro"}, {"f": "ตำแหน่ง motor area สัมพันธ์กับ coronal suture อย่างไร?", "b": "หลัง coronal suture ประมาณ 4 ซม. = ตำแหน่ง motor area", "t": "Neurology"}, {"f": "Pterion คืออะไร และทำไมอันตราย?", "b": "กระดูกบางที่สุดบริเวณ temporal squama มี middle meningeal artery วิ่งผ่าน / ถ้าแตกอาจถึงตาย", "t": "Neurology"}, {"f": "ร่องสมองหลัก 2 เส้นที่แบ่ง lobe คืออะไร?", "b": "Central sulcus (แบ่ง frontal-parietal) / Sylvian fissure (แบ่ง frontal-temporal)", "t": "Neurology"}, {"f": "Omega sign บน MRI ใช้ทำอะไร?", "b": "Landmark หาตำแหน่ง motor area รูปร่างคล้ายตัวโอเมก้ากลับด้าน", "t": "Neurology"}, {"f": "Motor pathway กับ sensory pathway cross midline ต่างกันตรงไหน?", "b": "Motor cross ที่ base of skull / sensory cross ที่ระดับ spinal cord ด้านล่าง — ใช้ location รอยโรค", "t": "Neurology"}, {"f": "Uncal herniation ตรวจร่างกายพบอะไร?", "b": "Pupil โตข้างเดียวกับรอยโรค (กด midbrain) + อ่อนแรงฝั่งตรงข้าม (กด corticospinal tract) / เป็น herniation ชนิดเดียวที่แยกได้ชัดเจน", "t": "Neurology"}, {"f": "Brain tumor ส่วนใหญ่ทำให้เกิด edema ชนิดใด?", "b": "Vasogenic edema (จาก blood brain barrier เสีย)", "t": "Neurology"}, {"f": "Gerstmann syndrome ประกอบด้วยอาการอะไรบ้าง (4 อย่าง)?", "b": "Acalculia / Finger agnosia / Left-right disorientation / Agraphia-agnosia", "t": "Neurology"}, {"f": "Schwannoma ต่างจาก Neurofibroma อย่างไร?", "b": "Schwannoma = เนื้องอกปลอกหุ้มเส้นประสาท (เส้นประสาทอาจยังปกติ) / Neurofibroma = เนื้องอกตัวเส้นประสาทเอง (มักเสียการทำงานก่อนรักษา)", "t": "Neurology"}, {"f": "NF1 NF2 คืออะไร?", "b": "Neurofibromatosis — กลุ่มพันธุกรรมที่มีเนื้องอกเส้นประสาทหลายตำแหน่ง", "t": "Neurology"}, {"f": "Acoustic neuroma ขนาดเท่าใดพิจารณา radiosurgery แทนผ่าตัด?", "b": "ไม่เกิน 2 ซม. และการได้ยินยังดี", "t": "Neurology"}, {"f": "การทำ awake craniotomy จำเป็นสำหรับ function ใดเป็นพิเศษ?", "b": "Language (motor/sensory ทดสอบได้ทั้ง awake หรือ asleep) เพราะ 1 ภาษา = 1 area สมอง", "t": "Neurology"}, {"f": "MR spectroscopy (MRS) ใช้แยกอะไร?", "b": "Peak สารเคมีสูง = เซลล์มีชีวิต / peak ต่ำหรือ flat = necrosis (เนื้อตาย)", "t": "Neurology"}, {"f": "Aneurysm rupture มีอัตราเสียชีวิตทันทีเท่าใด และ vasospasm เกิดช่วงใด?", "b": "เสียชีวิตทันที ~30% / ในผู้รอด 2 ใน 3 ครึ่งหนึ่งมี permanent deficit / vasospasm เกิดวันที่ 3-21", "t": "Neurology"}, {"f": "Surgical clipping vs endovascular coiling ใช้เวลาต่างกันอย่างไร?", "b": "Clipping 4-5 ชั่วโมง / Coiling 1-2 ชั่วโมง (ในมือผู้ชำนาญ)", "t": "Neurology"}, {"f": "AVM endovascular embolization มีโอกาสสำเร็จเท่าใด?", "b": "ประมาณ 20-30%", "t": "Neurology"}, {"f": "Meningioma ได้เลือดเลี้ยงจากเส้นเลือดใด ต่างจากเนื้อสมองอย่างไร?", "b": "External carotid artery (เยื่อสมอง) ส่วนเนื้อสมองใช้ internal carotid artery / คนละระบบ ทำให้ผ่าตัด preserve เนื้อสมองได้ดี", "t": "Neurology"}, {"f": "Broca's area เสีย vs Wernicke's area เสีย ต่างกันอย่างไร?", "b": "Broca เสีย = ฟังรู้เรื่องแต่พูดไม่ได้ / Wernicke เสีย = พูดคล่อง (fluent) แต่ comprehension เสีย ตอบไม่ตรงคำถาม", "t": "Neurology"}, {"f": "มดลูก (uterus) ขนาดและน้ำหนักเท่าไร?", "b": "8×6×4 ซม. หนัก 45-55 กรัม", "t": "OBGYNPeriop"}, {"f": "ท่อนำไข่ (fallopian tube) ยาวเท่าไร แบ่งเป็นกี่ส่วน?", "b": "ยาว 8-14 ซม. / แบ่ง 4 ส่วน: interstitial part - isthmus - ampulla - fimbria", "t": "OBGYNPeriop"}, {"f": "รังไข่ (ovary) ขนาดเท่าไร?", "b": "3.5×2.5×1.5 ซม.", "t": "OBGYNPeriop"}, {"f": "ท่อเปิดของ Bartholin gland อยู่ตำแหน่งใดของ vestibule และขนาดต่อมเท่าไร?", "b": "เปิดที่ 4 และ 8 นาฬิกา / ขนาดต่อม 0.5-1 ซม.", "t": "OBGYNPeriop"}, {"f": "Follicular phase และ Luteal phase ยาวนานเท่าไร?", "b": "Follicular 10-14 วัน / Luteal 12-14 วัน", "t": "OBGYNPeriop"}, {"f": "ลำดับเหตุการณ์สำคัญของ ovulatory phase ตามเวลา?", "b": "เอสโตรเจน >200 pg/ml นาน 50 ชม. → LH สูงสุดภายใน 14-24 ชม. → ovulation หลัง LH surge 34-36 ชม.", "t": "OBGYNPeriop"}, {"f": "ลำดับพัฒนาการวัยสาวตามปกติ 4 ขั้น?", "b": "Growth spurt → Thelarche → Pubarche → Menarche", "t": "OBGYNPeriop"}, {"f": "Hysterectomy Type I ถึง V คืออะไร?", "b": "I=simple / II=modified radical / III=radical / IV=extended radical / V=partial exenteration", "t": "OBGYNPeriop"}, {"f": "Staging of Laparoscopic Hysterectomy (0-5) หมายถึงอะไร?", "b": "Stage 0-5 ตามขั้นตอนที่ทำผ่านกล้องก่อนเปลี่ยนเป็น vaginal hysterectomy (เลขมากขึ้น = ทำผ่านกล้องมากขึ้นก่อน)", "t": "OBGYNPeriop"}, {"f": "ปัจจัยเสี่ยงหัวใจกลุ่มสูงต่อการผ่าตัดมีอะไรบ้าง?", "b": "Unstable coronary syndrome / Severe valvular heart disease / Significant arrhythmia / Decompensated CHF / Dilated cardiomyopathy", "t": "OBGYNPeriop"}, {"f": "Postop gynecologic surgery แบ่งการเฝ้าระวังตามช่วงเวลาใด?", "b": "48 ชั่วโมงแรก (เฝ้าระวังภาวะแทรกซ้อนจากผ่าตัด/ยาสลบ) vs หลัง 48 ชม. (atelectasis, pneumonia, UTI, DVT)", "t": "OBGYNPeriop"}, {"f": "Emergency cesarean section ต้องทำ DDI ภายในเวลาเท่าไร?", "b": "≤30 นาที (code BLUE)", "t": "OBGYNPeriop"}, {"f": "Left lateral tilt ใช้มุมเอียงเท่าไร และป้องกันอะไร?", "b": "เอียงซ้าย 15 องศา ป้องกัน Supine Hypotensive Syndrome จากมดลูกกดทับ IVC", "t": "OBGYNPeriop"}, {"f": "อัตราการบาดเจ็บอวัยวะข้างเคียงในผ่าตัดนรีเวช เรียงจากมากไปน้อย?", "b": "Bladder 1-2% > Bowel 0.1-1% > Ureter 0.1-0.5%", "t": "OBGYNPeriop"}, {"f": "DVT ในมะเร็งรังไข่กลุ่มเลาะต่อมน้ำเหลืองพบได้เท่าไร?", "b": "17-38%", "t": "OBGYNPeriop"}, {"f": "ความเข้มข้น Chlorhexidine ใช้ต่างกันอย่างไรตามบริบท?", "b": "2% ทั่วไป / 0.5% ช่องคลอด / 2% in IPA70% สำหรับ morbid obesity / 4% scrub", "t": "OBGYNPeriop"}, {"f": "Aldrete Score เกณฑ์ discharge ต้องได้เท่าไร?", "b": "≥9 คะแนน", "t": "OBGYNPeriop"}, {"f": "ISBAR ย่อมาจากอะไร?", "b": "Identify - Situation - Background - Assessment - Recommendation", "t": "OBGYNPeriop"}, {"f": "Da Vinci เปิดตัวปีใด และ FDA อนุมัติปีใด?", "b": "เปิดตัว 1999 / FDA อนุมัติ 2000 (ครอบคลุม General, Urology, Gynecologic)", "t": "RoboticGYN"}, {"f": "หุ่นยนต์ตัวแรกที่ทำ gynecological surgery คือใคร ปีใด?", "b": "ZEUS ป แห่ง)", "t": "RoboticGYN"}, {"f": "การศึกษา Lim PC พบ Da Vinci RAS มี postop complication และ length of stay เท่าไรเทียบ open?", "b": "RAS complication 6.3% vs open 21% / LOS RAS 1.37±1.1 วัน vs open 3.0±1.6 วัน", "t": "RoboticGYN"}, {"f": "ยาขยายม่านตาชนิดใดออกฤทธิ์เร็วและหมดฤทธิ์เร็วที่สุด?", "b": "Tropicamide 1% (Mydriacyl) onset 30 นาที / duration 5-6 ชม.", "t": "OphthalmicNursing"}, {"f": "Cycloplegic ที่ออกฤทธิ์นานที่สุดคือตัวใด นานเท่าไร?", "b": "Atropine sulfate 1% / duration 2 สัปดาห์", "t": "OphthalmicNursing"}, {"f": "Phenylephrine HCl (mydriatic) จัดเป็นกลุ่มยาอะไร และ onset/duration เท่าไร?", "b": "Sympathomimetic / onset 30 นาที / duration 2-3 ชม.", "t": "OphthalmicNursing"}, {"f": "ยาชาเฉพาะที่ Tetracaine 0.5% onset/duration เท่าไร?", "b": "onset 30-60 วินาที / duration 15-30 นาที", "t": "OphthalmicNursing"}, {"f": "สูตรผสมขยายม่านตา 1% mydriacyl : 10% phenylephrine อัตราส่วนเท่าไร?", "b": "3:1", "t": "OphthalmicNursing"}, {"f": "ขนาดรูม่านตาที่ dilated เต็มที่ประมาณเท่าไร?", "b": "8-9 มม.", "t": "OphthalmicNursing"}, {"f": "Lidocaine (xylocaine) แบบ infiltration onset/duration เท่าไร?", "b": "onset 5 นาที / duration 1-2 ชม.", "t": "OphthalmicNursing"}, {"f": "Bupivacaine (marcaine) duration เท่าไร และผสมกับอะไรได้?", "b": "duration 6-10 ชม. / ผสม xylocaine อัตราส่วน 1:1", "t": "OphthalmicNursing"}, {"f": "Viscoelastic agent มีหน้าที่และผลข้างเคียงอะไร?", "b": "ปกป้อง corneal endothelium ลดการสูญเสียเซลล์ รักษาปริมาตรลูกตา / ผลข้างเคียงเพิ่ม intraocular pressure", "t": "OphthalmicNursing"}, {"f": "Miotic agent แบบ intracameral มีตัวใดบ้าง ออกฤทธิ์อย่างไร?", "b": "Miochol-E (acetylcholine chloride) และ Miostat (carbachol) / ออกฤทธิ์ทันที", "t": "OphthalmicNursing"}, {"f": "Vancomycin intracameral ใช้ขนาดเท่าไร ครอบคลุมเชื้ออะไร?", "b": "1mg/0.1cc / ครอบคลุม gram-positive", "t": "OphthalmicNursing"}, {"f": "Acetazolamide (Diamox) รูปแบบและขนาดที่ใช้เท่าไร?", "b": "Tab. 125-250 mg", "t": "OphthalmicNursing"}, {"f": "Antifibrotic agent ที่ใช้ใน glaucoma surgery มีอะไรบ้าง ขนาดเท่าไร?", "b": "Mitomycin-C 2 mg / 5-FU 5 mg", "t": "OphthalmicNursing"}, {"f": "Glaucoma Drainage Device มี 3 ชนิดคืออะไรบ้าง?", "b": "Ahmed Shunt / Baerveldt Shunt / Molteno Shunt", "t": "OphthalmicNursing"}, {"f": "Endophthalmitis คืออะไร ถือเป็นภาวะอย่างไร?", "b": "การติดเชื้อในลูกตา / ถือเป็นภาวะฉุกเฉินต้องรีบรักษา", "t": "OphthalmicNursing"}, {"f": "Flat chamber กับ Hypotony ต่างกันอย่างไร?", "b": "Flat chamber = over drainage หลัง trabeculectomy / Hypotony = แก้ด้วย wound suture หลัง retina surgery", "t": "OphthalmicNursing"}, {"f": "Early warning sign หลังผ่าตัดตาที่ต้องสอนผู้ป่วยมีอะไรบ้าง?", "b": "ตามัวลง / ปวดตา / ตาแดง / มีขี้ตา", "t": "OphthalmicNursing"}, {"f": "Povidone-iodine solution เตรียมผิวก่อนผ่าตัดตาความเข้มข้นเท่าไร?", "b": "5%", "t": "OphthalmicNursing"}, {"f": "Pressure Injury แบ่งเป็นกี่ระดับ และมีลักษณะพิเศษกี่แบบที่ระบุระดับไม่ได้?", "b": "4 ระดับ (Stage 1-4) + 2 ลักษณะพิเศษ: Unstageable, DTPI", "t": "MEWSPressureInjury"}, {"f": "Blanching test ทำอย่างไร?", "b": "กดรอยแดงนาน 3 วินาที แล้วปล่อย ดูว่ารอยแดงจางหรือคงอยู่", "t": "MEWSPressureInjury"}, {"f": "Perioperative Pressure Injury ปรากฏอาการภายในกี่ชั่วโมงหลังผ่าตัด?", "b": "48-72 ชั่วโมง", "t": "MEWSPressureInjury"}, {"f": "OR Skin Prevention Bundle มีกี่องค์ประกอบ อะไรบ้าง?", "b": "4 องค์ประกอบ: Maintenance of normothermia (36-37.5°C) / Special padding / Positioning Devices / Polyurethane foam dressing", "t": "MEWSPressureInjury"}, {"f": "เกณฑ์ควบคุมอุณหภูมิผู้ป่วยใน OR Skin Prevention Bundle คือช่วงใด?", "b": "36°C - 37.5°C", "t": "MEWSPressureInjury"}, {"f": "KPI เป้าหมาย 3 ตัวชี้วัดของ MEWS ในการป้องกันแผลกดทับคืออะไร?", "b": "อัตราการใช้ MEWS ≥80% / แผลกดทับระดับ1 <2% / แผลกดทับตั้งแต่ระดับ2 =0%", "t": "MEWSPressureInjury"}, {"f": "ปัจจัยเสี่ยง Preop ที่ต้องพิจารณาร่วมกับ Operative time ≥3 ชม. มีอะไรบ้าง?", "b": "Position (Prone/Parkbench-Lateral/Lithotomy/Supine) / Age ≥62 / BMI <19 หรือ >40 / ASA class ≥3", "t": "MEWSPressureInjury"}, {"f": "MDRPI กับ MMPI ต่างกันอย่างไรในการระบุระดับ?", "b": "MDRPI (จากอุปกรณ์การแพทย์บนผิวหนัง) ระบุระดับได้เหมือน Pressure Injury / MMPI (เยื่อบุผิว) ระบุระดับไม่ได้", "t": "MEWSPressureInjury"}, {"f": "แรงไถล (Shear) เกิดจากแรง 2 ชนิดใดสวนทางกัน?", "b": "แรงโน้มถ่วงโลก และแรงเสียดสี (Friction)", "t": "MEWSPressureInjury"}, {"f": "แรงเสียดสี (Friction) เพียงอย่างเดียวทำให้เกิดแผลกดทับได้หรือไม่?", "b": "ไม่ได้ เป็นเพียงปัจจัยส่งเสริมเมื่อร่วมกับแรงกดและ/หรือแรงไถล", "t": "MEWSPressureInjury"}, {"f": "MARSI วินิจฉัยเมื่อมีอาการหลังลอกวัสดุยึดติดนานเท่าไร และเทคนิคลอกที่ถูกต้องคืออะไร?", "b": "≥30 นาที / Two finger technique ดึงตามแนวขน มุมไม่เกิน 45 องศา", "t": "MEWSPressureInjury"}, {"f": "Stage 1 ของแผลกดทับมีลักษณะอย่างไร?", "b": "ผิวหนังยังไม่ฉีกขาด มีรอยแดง และรอยแดงยังคงอยู่เมื่อกด (Non-blanchable erythema)", "t": "MEWSPressureInjury"}, {"f": "Stage 2 ของแผลกดทับมีลักษณะอย่างไร?", "b": "สูญเสียผิวหนังบางส่วน มองเห็นชั้นหนังแท้ ตุ่มน้ำใสหรือแตกแล้ว ไม่มี granulation/slough/eschar", "t": "MEWSPressureInjury"}, {"f": "DTPI มีลักษณะอย่างไร?", "b": "สีผิวเปลี่ยนเป็นแดงช้ำ/ม่วง ผิวหนังฉีกขาดหรือไม่ก็ได้ อาจมีตุ่มน้ำปนเลือด", "t": "MEWSPressureInjury"}, {"f": "ผลลัพธ์อัตราแผลกดทับระดับ 1 ปี 2569 (เม.ย.-มิ.ย.) เทียบเป้าหมายเป็นอย่างไร?", "b": "3.48% เกินเป้าหมาย <2%", "t": "MEWSPressureInjury"}, {"f": "การแบ่งระดับแผลกดทับอ้างอิงแนวทางใด?", "b": "EPUAP/NPIAP/PPPIA Clinical Practice Guideline 2025", "t": "MEWSPressureInjury"}, {"f": "เกณฑ์ขนาด AAA ที่ต้องพิจารณาผ่าตัดในเพศชายและหญิงคือเท่าไร?", "b": "ชาย >5.5 ซม. / หญิง >5.2 ซม.", "t": "VascularSurgery"}, {"f": "นิยาม AAA (Abdominal Aortic Aneurysm) คือขนาดเท่าไร?", "b": "เส้นผ่านศูนย์กลาง >3 ซม. หรือโป่งกว่าปกติ >50%", "t": "VascularSurgery"}, {"f": "EVAR anatomical criteria: Aortic neck length และ angulation เท่าไร?", "b": "Neck length >10-15 mm / เส้นผ่านศูนย์กลาง 18-32 mm / angulation <45-60 องศา", "t": "VascularSurgery"}, {"f": "ภาวะแทรกซ้อนของ EVAR มีอะไรบ้าง?", "b": "Endoleak / Secondary intervention / Conversion to open surgery / Graft migration / Graft limb occlusion / Groin wound complication", "t": "VascularSurgery"}, {"f": "Aortoiliac occlusive disease มี 2 สาเหตุหลักคืออะไร ต่างกันอย่างไร?", "b": "Atherosclerosis (สูบบุหรี่ เบาหวาน ความดันสูง ไขมันสูง) vs Peripheral arterial embolism (อายุน้อยกว่า อาการเฉียบพลัน)", "t": "VascularSurgery"}, {"f": "Intermittent claudication จาก atherosclerosis ทุเลาเมื่อพักกี่นาที?", "b": "10-15 นาที", "t": "VascularSurgery"}, {"f": "Aortobifemoral bypass กับ Axillobifemoral bypass ต่างกันอย่างไร?", "b": "Aortobifemoral = ผ่านหน้าท้อง ประสิทธิภาพสูงสุด (polyester knitted) / Axillobifemoral = ผ่าน axilla artery ไม่เปิดหน้าท้อง เหมาะผู้ป่วยหัวใจไม่ดี/ติดเชื้อช่องท้อง (PTFE ring)", "t": "VascularSurgery"}, {"f": "Contrast induced nephropathy นิยามด้วยค่า creatinine เพิ่มเท่าไร และห้ามใช้ contrast เกินเท่าไร?", "b": "Creatinine เพิ่ม >25% หรือ 0.5 mg/dl / ไม่ควรใช้ contrast เกิน 5 ml/kg", "t": "VascularSurgery"}, {"f": "หลังใส่ introducer สำหรับ endovascular femoro-popliteal ต้องให้ heparin ขนาดเท่าไร ควบคุม ACT เท่าไร?", "b": "Heparin 80/100 units/kg / ACT >250 วินาที", "t": "VascularSurgery"}, {"f": "Central venous catheter ชนิด Temporary กับ Permanent ต่างกันอย่างไร?", "b": "Temporary: 13-16-20 ซม. ไม่มี cuff <13 Fr / Permanent: ยาวถึง 36 ซม. มี cuff ถึง 15 Fr", "t": "VascularSurgery"}, {"f": "Heparin lock สำหรับ CVC ใช้ความเข้มข้นเท่าไร?", "b": "1000 unit/ml ปริมาณเท่า priming volume", "t": "VascularSurgery"}, {"f": "เกณฑ์ maturation ของ AVF (Rule of 6) มีอะไรบ้าง?", "b": "Diameter >6mm / Flow >600 ml/min / Depth <6mm / Duration >6 สัปดาห์", "t": "VascularSurgery"}, {"f": "ข้อบ่งชี้ทำ AV Graft คืออะไร?", "b": "ไม่มีหลอดเลือดเหมาะสมทำ AVF และต้องฟอกเลือดภายใน 6 สัปดาห์ (รอ AVF maturation ไม่ทัน)", "t": "VascularSurgery"}, {"f": "ลักษณะ GSV ที่ไม่เหมาะสมทำ RFA คืออะไรบ้าง?", "b": "GSV <2mm หรือ >15mm / Hx thrombophlebitis / tortuous GSV / GSV ใกล้ผิวหนัง / aneurysm ที่ SFJ", "t": "VascularSurgery"}, {"f": "หลัง venous stripping ต้องพันขานานเท่าไร แล้วเปลี่ยนถุงน่องนานเท่าไร?", "b": "พันขา 48 ชั่วโมง แล้วเปลี่ยนถุงน่องอย่างน้อย 1 สัปดาห์", "t": "VascularSurgery"}, {"f": "F.A.S.T. ที่สไลด์ระบุมีองค์ประกอบใดบ้าง และ TIA หายภายในกี่ชั่วโมง?", "b": "Face drooping / Arm weakness / Speech difficulty (สไลด์ไม่ได้ระบุความหมายตัว T) / TIA หายภายใน 24 ชั่วโมง", "t": "VascularSurgery"}, {"f": "Contrast agent ชนิด negative contrast คืออะไร มีข้อดีอย่างไรเทียบกับอากาศ?", "b": "Carbon dioxide (CO2) ดูดซึมง่ายกว่า เกิด spasm น้อยกว่า ฉีดเข้าเลือดได้ (อากาศห้ามฉีดเพราะเสี่ยง air embolism)", "t": "VascularSurgery"}, {"f": "Endarterectomy เหมาะกับผู้ป่วยแบบใด ข้อดี/ข้อเสียคืออะไร?", "b": "เหมาะกับ atherosclerosis อุดตันช่วงสั้น / ข้อดีไม่ใช้วัสดุเทียมลดติดเชื้อ / ข้อเสียไม่เหมาะกับผนังหลอดเลือดโป่งพอง", "t": "VascularSurgery"}];

let order = CARDS.map((_, i) => i);
(function(){
  const sel = document.getElementById('tagFilter');
  const all = document.createElement('option');
  all.value = '__all__'; all.textContent = `ทุกวิชา (${CARDS.length} การ์ด)`;
  sel.appendChild(all);
  [...new Set(CARDS.map(c => c.t))].sort().forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = `${t} (${CARDS.filter(c => c.t === t).length})`;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => {
    order = CARDS.map((_, i) => i).filter(i => sel.value === '__all__' || CARDS[i].t === sel.value);
    pos = 0; flipped = false; render();
  });
})();
let pos = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const flipBtn = document.getElementById('flipBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderMarkdownBold(str) {
  const escaped = escapeHtml(str);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function activeLabel() {
  const sel = document.getElementById('tagFilter');
  return (sel && sel.value !== '__all__') ? ` · ${sel.value}` : '';
}

function render() {
  if (!order.length) { frontText.textContent = '—'; backText.textContent = '—'; return; }
  const card = CARDS[order[pos]];
  frontText.innerHTML = renderMarkdownBold(card.f);
  backText.innerHTML = renderMarkdownBold(card.b);
  progressText.textContent = order.length ? `การ์ด ${pos + 1}/${order.length}${activeLabel()}` : 'ไม่มีการ์ด';
  progressFill.style.width = `${order.length ? ((pos + 1) / order.length) * 100 : 0}%`;
  if (flipped) {
    cardEl.classList.add('flipped');
  } else {
    cardEl.classList.remove('flipped');
  }
}

function goNext() {
  pos = (pos + 1) % CARDS.length;
  flipped = false;
  render();
}

function goPrev() {
  pos = (pos - 1 + CARDS.length) % CARDS.length;
  flipped = false;
  render();
}

function toggleFlip() {
  flipped = !flipped;
  render();
}

function shuffleCards() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  render();
}

cardEl.addEventListener('click', toggleFlip);
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
flipBtn.addEventListener('click', toggleFlip);
shuffleBtn.addEventListener('click', shuffleCards);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goPrev();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    goNext();
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleFlip();
  }
});

render();
</script>
</body>
</html>
